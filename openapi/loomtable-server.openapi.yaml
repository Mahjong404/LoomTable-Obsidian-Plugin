openapi: 3.1.0
info:
  title: LoomTable Server API
  version: 0.1.0
  description: |
    LoomTable Server çš„åˆç‰ˆ REST API åˆåŒã€‚
    Server æ˜¯ Workspaceã€Baseã€Tableã€Fieldã€Viewã€Record å’Œ Managed Attachment å…ƒæ•°æ®çš„äº‹å®æ¥æºã€‚
  license:
    name: GPL-3.0
servers:
  - url: http://localhost:3000
    description: Personal æœ¬åœ°æœåŠ¡ç¤ºä¾‹
  - url: '{serverUrl}'
    description: ç”¨æˆ·é…ç½®çš„ LoomTable Server
    variables:
      serverUrl:
        default: http://localhost:3000
tags:
  - name: Meta
  - name: Workspaces
  - name: Bases
  - name: Tables
  - name: Fields
  - name: Views
  - name: Records
  - name: Changes
  - name: Attachments
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      tags: [Meta]
      operationId: healthz
      security: []
      responses:
        '200':
          description: Server process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        default:
          $ref: '#/components/responses/ErrorResponse'

  /readyz:
    get:
      tags: [Meta]
      operationId: readyz
      security: []
      responses:
        '200':
          description: Server is ready to accept business requests
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          description: Server is alive but not ready; pending migrations return MIGRATION_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/meta:
    get:
      tags: [Meta]
      operationId: getServerMeta
      security: []
      responses:
        '200':
          description: Server capability and compatibility information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerMeta'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      responses:
        '200':
          description: Workspaces visible to the authenticated actor, ordered by createdAt ASC then id ASC
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/bases:
    get:
      tags: [Bases]
      operationId: listBases
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Bases in a Workspace, ordered by createdAt ASC then id ASC
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Base'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Bases]
      operationId: createBase
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBaseRequest'
      responses:
        '201':
          description: Base created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Base'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/tables:
    get:
      tags: [Tables]
      operationId: listTables
      parameters:
        - $ref: '#/components/parameters/BaseId'
        - $ref: '#/components/parameters/Lifecycle'
      responses:
        '200':
          description: Tables in a Base, ordered by createdAt ASC then id ASC
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Tables]
      operationId: createTable
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
      responses:
        '201':
          description: Table, Primary Field, and initial Grid View created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTableResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/tables/{tableId}:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [Tables]
      operationId: getTable
      responses:
        '200':
          description: Table metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [Tables]
      operationId: updateTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNameRequest'
      responses:
        '200':
          description: Table updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [Tables]
      operationId: deleteTable
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      responses:
        '204':
          description: Table moved to the recycle state
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/tables/{tableId}/restore:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      tags: [Tables]
      operationId: restoreTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreMetadataRequest'
      responses:
        '200':
          description: Table restored when its expected revision matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /v1/tables/{tableId}/fields:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [Fields]
      operationId: listFields
      parameters:
        - $ref: '#/components/parameters/Lifecycle'
      responses:
        '200':
          description: Fields in a Table, ordered by position ASC then id ASC
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Field'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [Fields]
      operationId: createField
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFieldRequest'
      responses:
        '201':
          description: Field created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
        '400':
          $ref: '#/components/responses/BadRequest'
